name: NodeJSproject
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
        working-directory: .github/workflows/nodejs-github-actions-demo
      - name: run tests
        run: npm test
        working-directory: .github/workflows/nodejs-github-actions-demo
  Build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v4
      - name: install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: install dependencies
        run: npm ci
        working-directory: .github/workflows/nodejs-github-actions-demo
      - name: Build
        run: echo "Build completed successfully"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-file
          path: .github/workflows/nodejs-github-actions-demo
  deploy:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: get Build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-file
      - name: list files
        run: ls -la
      - name: Deploy to server
        run: echo "Deploying the application..."
